
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalim Social</title>
  <meta name="description" content="Connect and share on Kalim Social.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }
    header {
      background: #1877f2;
      color: white;
      padding: 14px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 25px; }
    header span { font-size: 13px; }
    main {
      max-width: 680px;
      margin: 25px auto;
      padding: 0 14px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px #00000012;
    }
    h2 { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      background: #1877f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 4px 4px 4px 0;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.secondary { background: #e4e6eb; color: #1c1e21; }
    button.danger { background: #d93025; }
    button:focus, input:focus, textarea:focus {
      outline: 2px solid #8ab4f8;
      outline-offset: 1px;
    }
    .muted { color: #65676b; font-size: 13px; }
    .hidden { display: none !important; }
    .post { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .post-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .post-author { font-weight: bold; }
    .actions { border-top: 1px solid #eee; margin-top: 12px; padding-top: 8px; }
    .comment {
      background: #f0f2f5;
      border-radius: 9px;
      padding: 8px 11px;
      margin: 7px 0;
      overflow-wrap: anywhere;
    }
    .comment strong { font-size: 13px; }
    .comment p { margin: 4px 0 0; }
    #message { margin: 12px 0; font-size: 14px; }
    .success { color: #137333; }
    .error { color: #b3261e; }
    .admin-label { color: #1877f2; font-weight: bold; }
    footer { text-align: center; padding: 25px; color: #65676b; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Kalim Social</h1>
    <span>Connect · Share · Enjoy</span>
  </header>

  <main>
    <div id="message" role="status" aria-live="polite"></div>

    <section id="authCard" class="card">
      <h2 id="authHeading">Login to Kalim Social</h2>
      <form id="authForm">
        <div id="nameWrap" class="hidden">
          <input id="nameInput" type="text" maxlength="40"
            placeholder="Your name" autocomplete="name">
        </div>
        <input id="emailInput" type="email" placeholder="Email address"
          autocomplete="email" required>
        <input id="passwordInput" type="password" placeholder="Password"
          autocomplete="current-password" minlength="6" required>
        <button id="authSubmit" type="submit">Login</button>
      </form>
      <button id="switchAuth" class="secondary" type="button">
        Create a new account
      </button>
      <p class="muted">Use your own account. Never share your password.</p>
    </section>

    <section id="appArea" class="hidden">
      <section class="card">
        <div class="post-head">
          <div>
            <strong id="welcomeName"></strong>
            <div id="roleLabel" class="muted"></div>
          </div>
          <button id="logoutBtn" class="secondary" type="button">Logout</button>
        </div>
      </section>

      <section id="adminCard" class="card hidden">
        <h2>Admin Panel</h2>
        <p>Control whether users can like posts.</p>
        <p id="likeStatus" class="muted">Loading settings...</p>
        <button id="toggleLikesBtn" type="button">Change Likes Setting</button>
      </section>

      <section class="card">
        <h2>Create a post</h2>
        <form id="postForm">
          <textarea id="postText" maxlength="1000"
            placeholder="What's on your mind?" required></textarea>
          <button id="postSubmit" type="submit">Publish Post</button>
        </form>
      </section>

      <section>
        <h2>Latest Posts</h2>
        <div id="feed">
          <div class="card muted">Loading posts...</div>
        </div>
      </section>
    </section>
  </main>

  <footer>© 2026 Kalim Social</footer>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut,
      onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getFirestore, collection, doc, addDoc, updateDoc,
      deleteDoc, onSnapshot, query, orderBy,
      arrayUnion, arrayRemove
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKLuAP2lM993_dyxF_wIREqO9BNwQYRyw",
      authDomain: "kalim-social.firebaseapp.com",
      databaseURL: "https://kalim-social-default-rtdb.firebaseio.com",
      projectId: "kalim-social",
      storageBucket: "kalim-social.firebasestorage.app",
      messagingSenderId: "978230522539",
      appId: "1:978230522539:web:6e2c436d050d8140613dee",
      measurementId: "G-19ZZKD7XP6"
    };

    const ADMIN_UID = "FXCDzu3v58fQnOZA0R7XRmNgszn2";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const postsRef = collection(db, "posts");
    const settingsRef = doc(db, "settings", "main");

    let currentUser = null;
    let isAdmin = false;
    let allowLikes = true;
    let signupMode = false;
    let stopPosts = null;
    let stopSettings = null;

    function showMessage(message, type = "") {
      $("message").textContent = message;
      $("message").className = type;
    }

    function showError(error) {
      console.error(error);
      const messages = {
        "auth/email-already-in-use": "This email is already registered.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "permission-denied": "Permission denied. Check your Firestore rules.",
        "unavailable": "Network unavailable. Please try again."
      };
      showMessage(messages[error.code] || error.message || "Something went wrong.", "error");
    }

    function stopListeners() {
      if (stopPosts) stopPosts();
      if (stopSettings) stopSettings();
      stopPosts = null;
      stopSettings = null;
    }

    function setAuthMode(isSignup) {
      signupMode = isSignup;
      $("authHeading").textContent = isSignup ? "Create Account" : "Login to Kalim Social";
      $("authSubmit").textContent = isSignup ? "Sign Up" : "Login";
      $("nameWrap").classList.toggle("hidden", !isSignup);
      $("nameInput").required = isSignup;
      $("passwordInput").autocomplete = isSignup ? "new-password" : "current-password";
      $("switchAuth").textContent = isSignup
        ? "Already have an account? Login"
        : "Create a new account";
    }

    $("switchAuth").addEventListener("click", () => setAuthMode(!signupMode));

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = $("emailInput").value.trim();
      const password = $("passwordInput").value;

      try {
        $("authSubmit").disabled = true;
        if (signupMode) {
          const name = $("nameInput").value.trim();
          if (!name) throw new Error("Please enter your name.");
          const result = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(result.user, { displayName: name });
          showMessage("Account created successfully!", "success");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showMessage("Login successful!", "success");
        }
        $("authForm").reset();
      } catch (error) {
        showError(error);
      } finally {
        $("authSubmit").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        showMessage("You are logged out.", "success");
      } catch (error) {
        showError(error);
      }
    });

    $("postForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!currentUser) return showMessage("Please login first.", "error");

      const text = $("postText").value.trim();
      if (!text) return;

      try {
        $("postSubmit").disabled = true;
        await addDoc(postsRef, {
          text,
          authorId: currentUser.uid,
          authorName: currentUser.displayName || currentUser.email,
          createdAt: Date.now(),
          likes: [],
          comments: []
        });
        $("postText").value = "";
        showMessage("Your post has been published!", "success");
      } catch (error) {
        showError(error);
      } finally {
        $("postSubmit").disabled = false;
      }
    });

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
    }

    async function toggleLike(post) {
      if (!currentUser) return;
      if (!allowLikes) return showMessage("Likes are currently disabled by admin.", "error");

      const likes = Array.isArray(post.likes) ? post.likes : [];
      const alreadyLiked = likes.includes(currentUser.uid);

      try {
        await updateDoc(doc(db, "posts", post.id), {
          likes: alreadyLiked
            ? arrayRemove(currentUser.uid)
            : arrayUnion(currentUser.uid)
        });
      } catch (error) {
        showError(error);
      }
    }

    async function addComment(post, input, button) {
      const text = input.value.trim();
      if (!text || !currentUser) return;

      try {
        button.disabled = true;
        const comment = {
          id: crypto.randomUUID(),
          authorId: currentUser.uid,
          authorName: currentUser.displayName || currentUser.email,
          text,
          createdAt: Date.now()
        };
        await updateDoc(doc(db, "posts", post.id), {
          comments: arrayUnion(comment)
        });
        input.value = "";
      } catch (error) {
        showError(error);
      } finally {
        button.disabled = false;
      }
    }

    async function deletePost(post) {
      if (!isAdmin) return;
      if (!confirm("Are you sure you want to delete this post?")) return;

      try {
        await deleteDoc(doc(db, "posts", post.id));
        showMessage("Post deleted.", "success");
      } catch (error) {
        showError(error);
      }
    }

    function renderPost(post) {
      const card = makeElement("article", "card");
      const head = makeElement("div", "post-head");
      const authorArea = makeElement("div");
      authorArea.append(
        makeElement("div", "post-author", post.authorName || "User"),
        makeElement("div", "muted", formatDate(post.createdAt))
      );
      head.append(authorArea);

      if (isAdmin) {
        const remove = makeElement("button", "danger", "Delete");
        remove.type = "button";
        remove.addEventListener("click", () => deletePost(post));
        head.append(remove);
      }

      const body = makeElement("p", "post", post.text || "");
      const likes = Array.isArray(post.likes) ? post.likes : [];
      const comments = Array.isArray(post.comments) ? post.comments : [];

      const actions = makeElement("div", "actions");
      if (allowLikes) {
        const liked = currentUser && likes.includes(currentUser.uid);
        const likeBtn = makeElement("button", "secondary",
          (liked ? "Unlike" : "Like") + " · " + likes.length);
        likeBtn.type = "button";
        likeBtn.disabled = !currentUser;
        likeBtn.addEventListener("click", () => toggleLike(post));
        actions.append(likeBtn);
      } else {
        actions.append(makeElement("span", "muted", "Likes are disabled"));
      }
      actions.append(makeElement("span", "muted", " · " + comments.length + " comments"));

      const commentArea = makeElement("div");
      comments.forEach((comment) => {
        const item = makeElement("div", "comment");
        item.append(
          makeElement("strong", "", comment.authorName || "User"),
          makeElement("p", "", comment.text || "")
        );
        commentArea.append(item);
      });

      const commentForm = makeElement("form");
      const input = makeElement("input");
      input.type = "text";
      input.maxLength = 300;
      input.placeholder = currentUser ? "Write a comment..." : "Login to comment";
      input.disabled = !currentUser;
      input.required = true;

      const send = makeElement("button", "", "Comment");
      send.type = "submit";
      send.disabled = !currentUser;

      commentForm.append(input, send);
      commentForm.addEventListener("submit", (event) => {
        event.preventDefault();
        addComment(post, input, send);
      });

      card.append(head, body, actions, commentArea, commentForm);
      return card;
    }

    function listenToPosts() {
      if (stopPosts) stopPosts();
      const q = query(postsRef, orderBy("createdAt", "desc"));

      stopPosts = onSnapshot(q, (snapshot) => {
        const feed = $("feed");
        feed.replaceChildren();

        if (snapshot.empty) {
          feed.append(makeElement("div", "card muted", "No posts yet. Be the first to publish!"));
          return;
        }

        snapshot.forEach((item) => {
          feed.append(renderPost({ id: item.id, ...item.data() }));
        });
      }, showError);
    }

    function listenToSettings() {
      if (stopSettings) stopSettings();

      stopSettings = onSnapshot(settingsRef, (snapshot) => {
        if (!snapshot.exists()) {
          showMessage("Settings document is missing. Ask the admin to create settings/main.", "error");
          return;
        }

        allowLikes = snapshot.data().allowLikes === true;
        $("likeStatus").textContent = "Likes are " + (allowLikes ? "ON" : "OFF");
        $("toggleLikesBtn").textContent = allowLikes ? "Turn Likes OFF" : "Turn Likes ON";

        // Refresh posts so like buttons reflect the new setting.
        listenToPosts();
      }, showError);
    }

    $("toggleLikesBtn").addEventListener("click", async () => {
      if (!isAdmin) return;

      try {
        $("toggleLikesBtn").disabled = true;
        await updateDoc(settingsRef, { allowLikes: !allowLikes });
        showMessage("Likes setting updated.", "success");
      } catch (error) {
        showError(error);
      } finally {
        $("toggleLikesBtn").disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      stopListeners();
      currentUser = user;
      isAdmin = !!user && user.uid === ADMIN_UID;

      $("authCard").classList.toggle("hidden", !!user);
      $("appArea").classList.toggle("hidden", !user);

      if (!user) {
        $("feed").replaceChildren();
        return;
      }

      $("welcomeName").textContent =
        "Welcome, " + (user.displayName || user.email);
      $("roleLabel").textContent = isAdmin ? "Administrator" : "Member";
      $("roleLabel").className = isAdmin ? "admin-label" : "muted";
      $("adminCard").classList.toggle("hidden", !isAdmin);

      listenToPosts();
      listenToSettings();
    });

    setAuthMode(false);
  </script>
</body>
</html>
